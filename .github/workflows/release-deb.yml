name: Build Debian package

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes python3-venv python3-tk p7zip-full

      - name: Run tests
        run: python3 -m unittest -v test_auto_copier

      - name: Build .deb
        run: ./build_deb.sh "$GITHUB_REF_NAME"

      - name: Publish release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          repo="$GITHUB_REPOSITORY"
          asset="$(find dist -maxdepth 1 -type f -name 'auto-copier_*.deb' -print -quit)"
          if [[ -z "$asset" ]]; then
            echo "No .deb package found in dist/" >&2
            exit 1
          fi

          if ! gh release view "$tag" --repo "$repo" >/dev/null 2>&1; then
            gh release create "$tag" --repo "$repo" --verify-tag --draft \
              --title "$tag" \
              --generate-notes
          fi

          gh release upload "$tag" "$asset" --repo "$repo" --clobber
          gh release edit "$tag" --repo "$repo" --draft=false

          asset_name="${asset##*/}"
          is_draft="$(gh release view "$tag" --repo "$repo" --json isDraft --jq '.isDraft')"
          assets="$(gh release view "$tag" --repo "$repo" --json assets --jq '.assets[].name')"
          if [[ "$is_draft" != "false" ]] || ! grep -Fxq "$asset_name" <<< "$assets"; then
            echo "Release asset verification failed: $asset_name" >&2
            printf 'Release draft status: %s\nAssets:\n%s\n' "$is_draft" "$assets" >&2
            exit 1
          fi
          echo "Published release asset: $asset_name"
